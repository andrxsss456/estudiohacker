<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Estudio Hacker</title>
  <style>
    body {
      margin: 0;
      font-family: 'Courier New', Courier, monospace;
      background-color: #000;
      color: #00ff00;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background-color: #111;
      border-right: 1px solid #00ff00;
      display: flex;
      flex-direction: column;
    }

    .tab {
      padding: 12px;
      cursor: pointer;
      border-bottom: 1px solid #00ff00;
      transition: background 0.3s;
    }

    .tab:hover {
      background-color: #222;
    }

    .tab.active {
      background-color: #00ff00;
      color: #000;
      font-weight: bold;
    }

    .add-tab {
      padding: 12px;
      text-align: center;
      cursor: pointer;
      background-color: #222;
      border-top: 1px solid #00ff00;
    }

    .add-tab:hover {
      background-color: #333;
    }

    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.5s;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="tab active" data-tab="inicio">Inicio</div>
    <div class="tab" data-tab="terminal">Terminal</div>
    <div class="tab" data-tab="config">Configuración</div>
    <div class="add-tab">+ Nueva pestaña</div>
  </div>

  <div class="content">
    <div id="inicio" class="tab-content active">
      <h1>Panel de Estudio</h1>
      <p>Organiza tus materias y proyectos aquí.</p>
    </div>
    <div id="terminal" class="tab-content">
      <h1>Terminal</h1>
      <pre>
> ping servidor
Respuesta: conexión establecida
> ls
Matemáticas  Física  Historia
      </pre>
    </div>
    <div id="config" class="tab-content">
      <h1>Configuración</h1>
      <p>Ajusta parámetros del sistema.</p>
    </div>
  </div>

  <script>
    const sidebar = document.querySelector('.sidebar');
    const addTabBtn = document.querySelector('.add-tab');

    function activateTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      tab.classList.add('active');
      const target = document.getElementById(tab.dataset.tab);
      target.classList.add('active');
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => activateTab(tab));
    });

    addTabBtn.addEventListener('click', () => {
      const nombre = prompt("Nombre de la nueva pestaña (ej: Matemáticas, Historia):");
      if (!nombre) return;

      const newTabId = `tab_${Date.now()}`;

      const newTab = document.createElement('div');
      newTab.classList.add('tab');
      newTab.dataset.tab = newTabId;
      newTab.textContent = nombre;
      sidebar.insertBefore(newTab, addTabBtn);

      const newContent = document.createElement('div');
      newContent.id = newTabId;
      newContent.classList.add('tab-content');
      newContent.innerHTML = `<h1>${nombre}</h1><p>Aquí puedes escribir tus apuntes de ${nombre}...</p>`;
      document.querySelector('.content').appendChild(newContent);

      newTab.addEventListener('click', () => activateTab(newTab));
      activateTab(newTab);
    });
 <div id="config" class="tab-content">

  aplicarBtn.addEventListener('click', () => {

<div id="config" class="tab-content">
  <h1>Configuración</h1>
  <p>Ajusta parámetros del sistema:</p>

  <!-- Selector de color de texto -->
  <label for="colorTexto">Color del texto:</label>
  <input type="color" id="colorTexto" value="#00ff00"><br><br>

  <!-- Selector de tamaño de fuente -->
  <label for="tamanoFuente">Tamaño de fuente:</label>
  <input type="number" id="tamanoFuente" value="16"> px<br><br>

  <!-- Selector de tipografía -->
  <label for="tipografia">Tipografía:</label>
  <select id="tipografia">
    <option value="'Courier New', monospace">Courier New</option>
    <option value="Consolas, monospace">Consolas</option>
    <option value="Monaco, monospace">Monaco</option>
  </select><br><br>

  <!-- Botón para aplicar cambios -->
  <button id="aplicarConfig">Aplicar cambios</button>
</div>

<script>
  const aplicarBtn = document.getElementById('aplicarConfig');

  // Función para aplicar cambios
  function aplicarConfiguracion() {
    const color = document.getElementById('colorTexto').value;
    const tamano = document.getElementById('tamanoFuente').value;
    const tipografia = document.getElementById('tipografia').value;

    // Aplicar cambios globales
    document.body.style.color = color;
    document.body.style.fontSize = tamano + "px";
    document.body.style.fontFamily = tipografia;

    // Guardar en localStorage
    localStorage.setItem('colorTexto', color);
    localStorage.setItem('tamanoFuente', tamano);
    localStorage.setItem('tipografia', tipografia);
  }

  aplicarBtn.addEventListener('click', aplicarConfiguracion);

  // Al cargar la página, recuperar configuración guardada
  window.addEventListener('load', () => {
    const color = localStorage.getItem('colorTexto') || "#00ff00";
    const tamano = localStorage.getItem('tamanoFuente') || "16";
    const tipografia = localStorage.getItem('tipografia') || "'Courier New', monospace";

    document.getElementById('colorTexto').value = color;
    document.getElementById('tamanoFuente').value = tamano;
    document.getElementById('tipografia').value = tipografia;

    document.body.style.color = color;
    document.body.style.fontSize = tamano + "px";
    document.body.style.fontFamily = tipografia;
  });

  const sidebar = document.querySelector('.sidebar');
  const addTabBtn = document.querySelector('.add-tab');

  function activateTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    tab.classList.add('active');
    const target = document.getElementById(tab.dataset.tab);
    target.classList.add('active');
  }

  // Activar pestañas existentes
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => activateTab(tab));
  });

  // Crear nuevas pestañas con área editable
  addTabBtn.addEventListener('click', () => {
    const nombre = prompt("Nombre de la nueva pestaña (ej: Matemáticas, Historia):");
    if (!nombre) return;

    const newTabId = `tab_${Date.now()}`;

    const newTab = document.createElement('div');
    newTab.classList.add('tab');
    newTab.dataset.tab = newTabId;
    newTab.textContent = nombre;
    sidebar.insertBefore(newTab, addTabBtn);

    const newContent = document.createElement('div');
    newContent.id = newTabId;
    newContent.classList.add('tab-content');

    // Área editable para apuntes
    const textarea = document.createElement('textarea');
    textarea.style.width = "100%";
    textarea.style.height = "300px";
    textarea.style.backgroundColor = "#000";
    textarea.style.color = "#00ff00";
    textarea.style.fontFamily = "'Courier New', monospace";
    textarea.value = localStorage.getItem(newTabId) || ""; // Recuperar apuntes guardados

    // Guardar automáticamente al escribir
    textarea.addEventListener('input', () => {
      localStorage.setItem(newTabId, textarea.value);
    });

    newContent.innerHTML = `<h1>${nombre}</h1>`;
    newContent.appendChild(textarea);
    document.querySelector('.content').appendChild(newContent);

    newTab.addEventListener('click', () => activateTab(newTab));
    activateTab(newTab);
  });

  // Recuperar pestañas guardadas al cargar
  window.addEventListener('load', () => {
    for (let key in localStorage) {
      if (key.startsWith("tab_")) {
        const nombre = "Recuperado"; // puedes mejorar guardando también el nombre
        const newTab = document.createElement('div');
        newTab.classList.add('tab');
        newTab.dataset.tab = key;
        newTab.textContent = nombre;
        sidebar.insertBefore(newTab, addTabBtn);

        const newContent = document.createElement('div');
        newContent.id = key;
        newContent.classList.add('tab-content');

        const textarea = document.createElement('textarea');
        textarea.style.width = "100%";
        textarea.style.height = "300px";
        textarea.style.backgroundColor = "#000";
        textarea.style.color = "#00ff00";
        textarea.style.fontFamily = "'Courier New', monospace";
        textarea.value = localStorage.getItem(key) || "";

        textarea.addEventListener('input', () => {
          localStorage.setItem(key, textarea.value);
        });

        newContent.innerHTML = `<h1>${nombre}</h1>`;
        newContent.appendChild(textarea);
        document.querySelector('.content').appendChild(newContent);

        newTab.addEventListener('click', () => activateTab(newTab));
      }
    }
  });

  const sidebar = document.querySelector('.sidebar');
  const addTabBtn = document.querySelector('.add-tab');

  function activateTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    tab.classList.add('active');
    const target = document.getElementById(tab.dataset.tab);
    target.classList.add('active');
  }

  // Activar pestañas existentes
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => activateTab(tab));
  });

  // Crear nuevas pestañas con nombre y apuntes
  addTabBtn.addEventListener('click', () => {
    const nombre = prompt("Nombre de la nueva pestaña (ej: Matemáticas, Historia):");
    if (!nombre) return;

    const newTabId = `tab_${Date.now()}`;

    const newTab = document.createElement('div');
    newTab.classList.add('tab');
    newTab.dataset.tab = newTabId;
    newTab.textContent = nombre;
    sidebar.insertBefore(newTab, addTabBtn);

    const newContent = document.createElement('div');
    newContent.id = newTabId;
    newContent.classList.add('tab-content');

    // Área editable para apuntes
    const textarea = document.createElement('textarea');
    textarea.style.width = "100%";
    textarea.style.height = "300px";
    textarea.style.backgroundColor = "#000";
    textarea.style.color = "#00ff00";
    textarea.style.fontFamily = "'Courier New', monospace";
    textarea.value = "";

    // Guardar automáticamente nombre y apuntes
    textarea.addEventListener('input', () => {
      localStorage.setItem(newTabId, JSON.stringify({
        nombre: nombre,
        contenido: textarea.value
      }));
    });

    newContent.innerHTML = `<h1>${nombre}</h1>`;
    newContent.appendChild(textarea);
    document.querySelector('.content').appendChild(newContent);

    newTab.addEventListener('click', () => activateTab(newTab));
    activateTab(newTab);

    // Guardar pestaña en localStorage
    localStorage.setItem(newTabId, JSON.stringify({
      nombre: nombre,
      contenido: ""
    }));
  });

  // Recuperar pestañas guardadas al cargar
  window.addEventListener('load', () => {
    for (let key in localStorage) {
      if (key.startsWith("tab_")) {
        const data = JSON.parse(localStorage.getItem(key));
        if (!data) continue;

        const newTab = document.createElement('div');
        newTab.classList.add('tab');
        newTab.dataset.tab = key;
        newTab.textContent = data.nombre;
        sidebar.insertBefore(newTab, addTabBtn);

        const newContent = document.createElement('div');
        newContent.id = key;
        newContent.classList.add('tab-content');

        const textarea = document.createElement('textarea');
        textarea.style.width = "100%";
        textarea.style.height = "300px";
        textarea.style.backgroundColor = "#000";
        textarea.style.color = "#00ff00";
        textarea.style.fontFamily = "'Courier New', monospace";
        textarea.value = data.contenido || "";

        textarea.addEventListener('input', () => {
          localStorage.setItem(key, JSON.stringify({
            nombre: data.nombre,
            contenido: textarea.value
          }));
        });

        newContent.innerHTML = `<h1>${data.nombre}</h1>`;
        newContent.appendChild(textarea);
        document.querySelector('.content').appendChild(newContent);

        newTab.addEventListener('click', () => activateTab(newTab));
      }
    }
  });

  const sidebar = document.querySelector('.sidebar');
  const addTabBtn = document.querySelector('.add-tab');

  function activateTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    tab.classList.add('active');
    const target = document.getElementById(tab.dataset.tab);
    target.classList.add('active');
  }

  // Activar pestañas existentes
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => activateTab(tab));
  });

  // Crear nuevas pestañas con nombre, apuntes y botón eliminar
  addTabBtn.addEventListener('click', () => {
    const nombre = prompt("Nombre de la nueva pestaña (ej: Matemáticas, Historia):");
    if (!nombre) return;

    const newTabId = `tab_${Date.now()}`;

    const newTab = document.createElement('div');
    newTab.classList.add('tab');
    newTab.dataset.tab = newTabId;
    newTab.textContent = nombre;
    sidebar.insertBefore(newTab, addTabBtn);

    const newContent = document.createElement('div');
    newContent.id = newTabId;
    newContent.classList.add('tab-content');

    // Área editable para apuntes
    const textarea = document.createElement('textarea');
    textarea.style.width = "100%";
    textarea.style.height = "300px";
    textarea.style.backgroundColor = "#000";
    textarea.style.color = "#00ff00";
    textarea.style.fontFamily = "'Courier New', monospace";
    textarea.value = "";

    textarea.addEventListener('input', () => {
      localStorage.setItem(newTabId, JSON.stringify({
        nombre: nombre,
        contenido: textarea.value
      }));
    });

    // Botón eliminar pestaña
    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = "Eliminar pestaña";
    deleteBtn.style.marginTop = "10px";
    deleteBtn.style.backgroundColor = "#222";
    deleteBtn.style.color = "#00ff00";
    deleteBtn.style.border = "1px solid #00ff00";
    deleteBtn.style.cursor = "pointer";

    deleteBtn.addEventListener('click', () => {
      // Eliminar pestaña y contenido
      newTab.remove();
      newContent.remove();
      localStorage.removeItem(newTabId);
    });

    newContent.innerHTML = `<h1>${nombre}</h1>`;
    newContent.appendChild(textarea);
    newContent.appendChild(deleteBtn);
    document.querySelector('.content').appendChild(newContent);

    newTab.addEventListener('click', () => activateTab(newTab));
    activateTab(newTab);

    // Guardar pestaña en localStorage
    localStorage.setItem(newTabId, JSON.stringify({
      nombre: nombre,
      contenido: ""
    }));
  });

  // Recuperar pestañas guardadas al cargar
  window.addEventListener('load', () => {
    for (let key in localStorage) {
      if (key.startsWith("tab_")) {
        const data = JSON.parse(localStorage.getItem(key));
        if (!data) continue;

        const newTab = document.createElement('div');
        newTab.classList.add('tab');
        newTab.dataset.tab = key;
        newTab.textContent = data.nombre;
        sidebar.insertBefore(newTab, addTabBtn);

        const newContent = document.createElement('div');
        newContent.id = key;
        newContent.classList.add('tab-content');

        const textarea = document.createElement('textarea');
        textarea.style.width = "100%";
        textarea.style.height = "300px";
        textarea.style.backgroundColor = "#000";
        textarea.style.color = "#00ff00";
        textarea.style.fontFamily = "'Courier New', monospace";
        textarea.value = data.contenido || "";

        textarea.addEventListener('input', () => {
          localStorage.setItem(key, JSON.stringify({
            nombre: data.nombre,
            contenido: textarea.value
          }));
        });

        // Botón eliminar pestaña
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = "Eliminar pestaña";
        deleteBtn.style.marginTop = "10px";
        deleteBtn.style.backgroundColor = "#222";
        deleteBtn.style.color = "#00ff00";
        deleteBtn.style.border = "1px solid #00ff00";
        deleteBtn.style.cursor = "pointer";

        deleteBtn.addEventListener('click', () => {
          newTab.remove();
          newContent.remove();
          localStorage.removeItem(key);
        });

        newContent.innerHTML = `<h1>${data.nombre}</h1>`;
        newContent.appendChild(textarea);
        newContent.appendChild(deleteBtn);
        document.querySelector('.content').appendChild(newContent);

        newTab.addEventListener('click', () => activateTab(newTab));
      }
    }
  });
</script>




</body>
</html>
