<div id="config" class="tab-content">
  <h1>Configuración</h1>
  <p>Ajusta parámetros del sistema:</p>

  <!-- Selector de color de texto -->
  <label for="colorTexto">Color del texto:</label>
  <input type="color" id="colorTexto" value="#00ff00"><br><br>

  <!-- Selector de tamaño de fuente -->
  <label for="tamanoFuente">Tamaño de fuente:</label>
  <input type="number" id="tamanoFuente" value="16"> px<br><br>

  <!-- Selector de tipografía -->
  <label for="tipografia">Tipografía:</label>
  <select id="tipografia">
    <option value="'Courier New', monospace">Courier New</option>
    <option value="Consolas, monospace">Consolas</option>
    <option value="Monaco, monospace">Monaco</option>
  </select><br><br>

  <!-- Botón para aplicar cambios -->
  <button id="aplicarConfig">Aplicar cambios</button>
</div>

<script>
  const aplicarBtn = document.getElementById('aplicarConfig');

  aplicarBtn.addEventListener('click', () => {
    const color = document.getElementById('colorTexto').value;
    const tamano = document.getElementById('tamanoFuente').value;
    const tipografia = document.getElementById('tipografia').value;

    // Aplicar cambios globales
    document.body.style.color = color;
    document.body.style.fontSize = tamano + "px";
    document.body.style.fontFamily = tipografia;
  });
</script>
